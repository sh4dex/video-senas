<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Video con lengua de señas</title>

<script src="https://code.jquery.com/jquery-3.7.1.slim.min.js" integrity="sha256-kmHvs0B+OpCW5GVHUNjv9rOmY0IvSIRcf7zGUDTDQM8=" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ableplayer/ableplayer@v5.0.0/build/ableplayer.min.css">
<script src="https://cdn.jsdelivr.net/gh/ableplayer/ableplayer@v5.0.0/build/ableplayer.dist.js"></script>

<style>
	html, body { margin: 0; padding: 0; background: transparent; }
	/* ponytail: left-aligned (no margin:auto) and capped at 734px so Able
	   Player's own auto-positioning (getOptimumPosition in buildplayer.js)
	   finds room to place the sign window beside it, inside the 1200x600
	   Moodle iframe, without stacking below (which would force scroll).
	   734 wide -> ~413px video + ~90px controls, well under 600px tall;
	   leaves 1200-734-5(gap) = 461px to the right, enough for the sign
	   window's native 400px default width. Bump together if the iframe
	   size or sign window width ever changes. */
	.able-wrapper { max-width: 734px; }
</style>
</head>
<body>

	<video id="video1" data-able-player preload="auto" playsinline>
		<source type="video/mp4" src="media/main.mp4" data-sign-src="media/sign.mp4" />
	</video>

</body>
</html>
