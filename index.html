<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Video con lengua de señas</title>

<script src="https://code.jquery.com/jquery-3.7.1.slim.min.js" integrity="sha256-kmHvs0B+OpCW5GVHUNjv9rOmY0IvSIRcf7zGUDTDQM8=" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ableplayer/ableplayer@v5.0.0/build/ableplayer.min.css">
<script src="https://cdn.jsdelivr.net/gh/ableplayer/ableplayer@v5.0.0/build/ableplayer.dist.js"></script>

<style>
	html, body { margin: 0; padding: 0; background: transparent; }
	#player-row { display: flex; align-items: flex-start; gap: 8px; }
	#video-wrapper { flex: 1; min-width: 0; }
	/* ponytail: fixed width sign window via data-sign-div, simplest way to
	   get it beside the video instead of Able Player's default floating
	   popup (which overlaps the video and grows the iframe's height). */
	#sign-slot { width: 200px; flex-shrink: 0; }
</style>
</head>
<body>

	<div id="player-row">
		<div id="video-wrapper">
			<video id="video1" data-able-player preload="auto" data-youtube-nocookie="true" data-youtube-id="daLI6kaXDJ8" data-youtube-sign-src="YONA79Seg58" data-sign-div="sign-slot" playsinline>
			</video>
		</div>
		<div id="sign-slot"></div>
	</div>

</body>
</html>
